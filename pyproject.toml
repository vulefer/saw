[build-system]
# 77 is the first release that understands PEP 639 license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saw"
version = "0.2.0.dev0"
description = "A correctness-first solver for one-dimensional cutting-stock problems with independently verified solutions."
readme = "README.md"
# saw is proprietary, see LICENSE; PEP 639 forbids a license classifier next to this
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Petar Vujica", email = "petar.vujica@fer.hr" }]
keywords = ["cutting stock", "1d cutting", "optimization", "integer programming", "solver"]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
# the only runtime dependencies, keep this list narrow (see
# docs/dependencies.md). lower bounds are the oldest releases the
# minimum-dependencies ci job tests, upper bounds stop at the next major
dependencies = [
    # builds and runs the models; 3.3.2 is the first release that finds cbc
    # through cbcbox
    "PuLP>=3.3.2,<4",
    # ships the cbc binary the pulp backend calls
    "cbcbox>=2.929,<3",
]

[project.urls]
Homepage = "https://github.com/vulefer/saw"
Repository = "https://github.com/vulefer/saw"
Documentation = "https://github.com/vulefer/saw/tree/main/docs"
Issues = "https://github.com/vulefer/saw/issues"

[project.scripts]
saw = "saw.cli:main"

# the library itself never imports these, only the test suite does. bounds
# follow the same rule as the runtime ones
[project.optional-dependencies]
dev = [
    # checks the json contract tests against the draft 2020-12 schemas
    "jsonschema>=4.23,<5",
    # reads pyproject.toml and the locks in the dependency policy tests
    "packaging>=24,<27",
    "tomli>=2.0.1,<3; python_version < '3.11'",
    # runs the release suite
    "pytest>=9,<10",
    # builds the sdist and wheel for scripts/build_distributions.py
    "build>=1.2.1,<2",
    # formats and lints, see scripts/run_static_checks.py. ruff changes its
    # formatter style and rule set between 0.x minors, so the bound stops at
    # the next one
    "ruff>=0.16.9,<0.17",
    # checks the types of src/saw and scripts/
    "mypy>=2.3.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["saw*"]

# the wheel carries py.typed and the versioned json schemas; docs, examples
# and the release suite ship in the sdist only (see MANIFEST.in)
[tool.setuptools.package-data]
saw = ["py.typed", "schemas/*.schema.json"]

# scripts/run_static_checks.py runs ruff format, ruff check and mypy with
# exactly this configuration, locally and in ci
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "BLE",  # blind except, the intended ones say why with a noqa
    "UP",   # pyupgrade to the oldest supported python
    "SIM",  # simplifications
    "RUF",  # ruff's own checks
]
ignore = [
    # the formatter owns line length, it leaves long strings and urls alone
    "E501",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["saw", "scripts", "tests"]

[tool.mypy]
python_version = "3.10"
# tests are left out on purpose: they pass ill-typed values to exercise
# validation, and ruff still lints them
files = ["src", "scripts", "examples"]
strict = true

# ship no type information; saw only touches them in the backends and
# the smoke test, tomli is only installed on python 3.10
[[tool.mypy.overrides]]
module = ["pulp", "pulp.*", "cbcbox", "jsonschema", "jsonschema.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Constructing LpVariable.*directly is deprecated:DeprecationWarning",
]
