name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Saw and development dependencies
        run: python -m pip install --upgrade ".[dev]"

      - name: Run the release suite
        run: python scripts/run_release_tests.py

  minimum-dependencies:
    name: Minimum dependencies / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Saw with minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --no-deps
          python -m pip install "PuLP==3.3.2" "cbcbox==2.929" "jsonschema==4.23.0" "pytest==9.0.0"

      - name: Run the release suite
        run: python scripts/run_release_tests.py

  built-wheel:
    name: Build and test the wheel
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the distribution artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel
        shell: bash
        run: |
          python -m pip install "jsonschema>=4.23,<5" "pytest>=9,<10"
          python -m pip install dist/*.whl

      - name: Run the release suite against the wheel
        run: python scripts/run_release_tests.py
