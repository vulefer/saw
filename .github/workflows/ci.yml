name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install Saw and the locked development dependencies
        run: python -m pip install --constraint requirements/dev.txt ".[dev]"

      - name: Run the release suite
        run: python scripts/run_release_tests.py

  minimum-dependencies:
    name: Minimum dependencies / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/minimum.txt

      - name: Install Saw with the locked minimum dependencies
        run: python -m pip install --constraint requirements/minimum.txt --editable ".[dev]"

      - name: Run the release suite
        run: python scripts/run_release_tests.py

  # ignores the locks so a new upstream release inside the declared bounds
  # shows up here before anyone regenerates requirements/dev.txt
  latest-dependencies:
    name: Latest dependencies / CPython ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install Saw with the newest allowed dependencies
        run: python -m pip install --upgrade ".[dev]"

      - name: Run the release suite
        run: python scripts/run_release_tests.py

  built-wheel:
    name: Build, check and test the wheel
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up CPython 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install the locked build and check tools
        run: python -m pip install --constraint requirements/dev.txt build packaging

      # fails on a dirty checkout, a packaging mistake, or a build that
      # leaves anything but ignored outputs behind
      - name: Build and check the distribution artifacts
        run: python scripts/build_distributions.py

      - name: Install the built wheel
        shell: bash
        run: |
          python -m pip install --constraint requirements/dev.txt "$(ls dist/*.whl)[dev]"

      - name: Run the release suite against the wheel
        run: python scripts/run_release_tests.py
